apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
spec:
  replicas: 2

  selector:
    matchLabels:
      app: payment-service

  template:
    metadata:
      labels:
        app: payment-service

    spec:
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001

      containers:
        - name: payment-service
          image: payment-service:0.0.1-SNAPSHOT
          imagePullPolicy: Never

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9090

          env:
            - name: APP_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: payment-config
                  key: APP_ENVIRONMENT
            - name: OTLP_TRACES_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: payment-config
                  key: OTLP_TRACES_ENDPOINT
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: payment-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: USER_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: payment-config
                  key: USER_SERVICE_URL

          envFrom:
            - secretRef:
                name: payment-secret

          resources:
            requests:
              cpu: 100m
              memory: 384Mi
              ephemeral-storage: 100Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 500Mi

          startupProbe:
            httpGet:
              path: /api/actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60

          livenessProbe:
            httpGet:
              path: /api/actuator/health/liveness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /api/actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
spec:
  type: ClusterIP

  selector:
    app: payment-service

  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: grpc
      port: 9090
      targetPort: 9090
